spring.application.name=user-crud-mvc

# This module uses port 8081, so it can run at the same time as user-crud-rest (port 8080)
server.port=8081

# PostgreSQL connection (change username / password if yours are different)
spring.datasource.url=jdbc:postgresql://localhost:5432/user_crud
spring.datasource.username=postgres
spring.datasource.password=R0gueNEM

# Hibernate creates / updates the "users" table for you
spring.jpa.hibernate.ddl-auto=update

# Print the SQL that Hibernate runs (helps to understand what happens)
spring.jpa.show-sql=true

# Reload the HTML templates without restarting while you work
spring.thymeleaf.cache=false
